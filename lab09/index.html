<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Лабораторная работа №9: СМО с отказами</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  </head>
  <body>
    <div class="container">
      <h1>Система массового обслуживания с отказами (без очереди)</h1>

      <div class="main-layout">
        <div class="params-section">
          <h2>Параметры моделирования</h2>
          <div class="sim-params">
            <div class="param-item">
              <label>Интенсивность поступления λ (заявок/ед.вр)</label>
              <input type="number" id="lambda" value="3" step="0.5" min="0.1" />
            </div>
            <div class="param-item">
              <label>Интенсивность обслуживания μ (заявок/ед.вр)</label>
              <input type="number" id="mu" value="4" step="0.5" min="0.1" />
            </div>
            <div class="param-item">
              <label>Длительность симуляции T</label>
              <input type="number" id="simDuration" value="100" step="10" min="10" />
            </div>
          </div>

          <div class="controls">
            <button id="btnSimulate" class="btn-primary">Запустить симуляцию</button>
            <button id="btnReset" class="btn-secondary">Сброс</button>
          </div>

        </div>

        <div class="results-section">
          <h2>Результаты</h2>
          <div class="summary">
            <div class="summary-item">
              <span>Эмпир. вероятность простоя:</span>
              <strong id="empIdle">-</strong>
            </div>
            <div class="summary-item">
              <span>Эмпир. вероятность занятости:</span>
              <strong id="empBusy">-</strong>
            </div>
            <div class="summary-item">
              <span>Эмпир. вероятность отказа:</span>
              <strong id="empRejection">-</strong>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="main.js"></script>
  </body>
</html>
